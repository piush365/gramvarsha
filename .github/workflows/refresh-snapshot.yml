# Daily: run the real pipeline once and commit the offline fallback the website uses
# when the API is asleep or unreachable. The commit also redeploys the site on Vercel.
name: Refresh forecast snapshot

on:
  schedule:
    - cron: "30 0 * * *"      # 06:00 IST, after the 00Z GFS run is available
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Build snapshot (fails, and commits nothing, if the live fetch fails)
        run: python scripts/make_snapshot.py
      - name: Commit if changed
        run: |
          git config user.name "gramvarsha-bot"
          git config user.email "gramvarsha-bot@users.noreply.github.com"
          git add frontend/public/snapshot.json frontend/public/snapshot-advisories.json
          git diff --cached --quiet || git commit -m "Refresh forecast snapshot $(date -u +%F)"
          git push
