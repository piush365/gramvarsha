# Push the API to the Hugging Face Space whenever backend code, models or data change.
# Needs repository secret HF_TOKEN and repository variable HF_SPACE (e.g. "yourname/gramvarsha-api").
name: Deploy API to Hugging Face

on:
  push:
    branches: [main]
    paths: ["backend/**", "ml/models/**", "ml/metrics.json", "ml/*.py", "data/*.csv", "data/*.geojson"]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ vars.HF_SPACE != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: ./scripts/deploy_hf.sh "${{ vars.HF_SPACE }}"
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
